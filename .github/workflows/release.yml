name: Build and publish PIE binary

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Matching runtime and companion tag (for example v1.2.3)
        required: true
        type: string

permissions:
  contents: write
  packages: read

env:
  SOURCE_REPOSITORY: eloquage/vector
  RUNTIME_PACKAGE: eloquage/vector
  EXTENSION_NAME: eloquage_vector
  TYPEPHP_IMAGE: ghcr.io/eloquage/typephp-builder:30b6f43
  TYPEPHP_SOURCE_REPOSITORY: https://github.com/eloquage/typephp-builder.git
  TYPEPHP_SOURCE_REF: 069f9f8c45dc7be4be2951cab1b2b2b2f936bc7c

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout companion tag
        uses: actions/checkout@v4
        with:
          ref: ${{github.event.release.tag_name || inputs.version}}

      - name: Resolve and validate matching tags
        id: version
        env:
          RELEASE_TAG: ${{github.event.release.tag_name || ''}}
          INPUT_TAG: ${{inputs.version || ''}}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG:-$INPUT_TAG}"
          case "$VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Expected a vX.Y.Z release tag" >&2; exit 1 ;;
          esac
          git ls-remote --exit-code "https://github.com/$SOURCE_REPOSITORY.git" "refs/tags/$VERSION" >/dev/null
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout matching runtime source
        env:
          VERSION: ${{steps.version.outputs.version}}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$VERSION" "https://github.com/$SOURCE_REPOSITORY.git" source
          mkdir -p package-context
          tar --exclude=.dockerignore --exclude=build --exclude=vendor --exclude=.git -C source -cf - . | tar -C package-context -xf -
          php -r '$m=json_decode(file_get_contents("source/composer.json"), true, 512, JSON_THROW_ON_ERROR); exit(($m["name"] ?? "") === getenv("RUNTIME_PACKAGE") ? 0 : 1);'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare pinned TypePHP builder
        env:
          TYPEPHP_IMAGE: ${{env.TYPEPHP_IMAGE}}
          TYPEPHP_SOURCE_REPOSITORY: ${{env.TYPEPHP_SOURCE_REPOSITORY}}
          TYPEPHP_SOURCE_REF: ${{env.TYPEPHP_SOURCE_REF}}
        run: |
          set -euo pipefail
          if docker pull "$TYPEPHP_IMAGE" >/dev/null; then
            echo "TYPEPHP_LOCAL_FALLBACK=false" >> "$GITHUB_ENV"
          else
            echo "The pinned GHCR image is unavailable; building its pinned public source commit." >&2
            docker buildx build --builder default --pull --tag "$TYPEPHP_IMAGE" --load \
              "${TYPEPHP_SOURCE_REPOSITORY}#${TYPEPHP_SOURCE_REF}"
            echo "TYPEPHP_LOCAL_FALLBACK=true" >> "$GITHUB_ENV"
          fi
      - name: Build, load, and test the native module
        env:
          VERSION: ${{steps.version.outputs.version}}
          CACHE_SCOPE: pie-vector
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cat > Dockerfile.native <<'EOF'
          ARG TYPEPHP_IMAGE=ghcr.io/eloquage/typephp-builder:30b6f43
          FROM ${TYPEPHP_IMAGE}
          ARG EXTENSION_NAME
          ENV EXTENSION_NAME=$EXTENSION_NAME
          RUN set -eux; \
              test -n "${PHPX_HOME:-}"; \
              rm -rf /tmp/phpx-static /tmp/phpx-include; \
              mkdir -p /tmp/phpx-include; \
              ln -s /usr/include/x86_64-linux-gnu/gmp.h /tmp/phpx-include/gmp.h; \
              ln -s /usr/include/gmpxx.h /tmp/phpx-include/gmpxx.h; \
              ln -s /usr/include/mpfr.h /tmp/phpx-include/mpfr.h; \
              cmake -S "$PHPX_HOME/full-static" -B /tmp/phpx-static \
                -DCMAKE_BUILD_TYPE=Release \
                -DPHPX_PHP_INCLUDE_DIR=/usr/local/include/php \
                -DPHPX_GMP_INCLUDE_DIR=/tmp/phpx-include \
                -DPHPX_GMP_LIB_DIR=/usr/lib/x86_64-linux-gnu \
                -DPHPX_MPFR_INCLUDE_DIR=/tmp/phpx-include \
                -DPHPX_MPFR_LIB_DIR=/usr/lib/x86_64-linux-gnu; \
              cmake --build /tmp/phpx-static --parallel 2; \
              rm "$PHPX_HOME/lib/libphpx.so"; \
              cp /tmp/phpx-static/libphpx.a "$PHPX_HOME/lib/libphpx.a"; \
              ln -s libphpx.a "$PHPX_HOME/lib/libphpx.so"
          WORKDIR /src
          COPY --from=package . /src
          RUN set -eux; \
              test -f project.yml || cp project.yml.example project.yml; \
              composer install --prefer-dist --no-interaction --no-progress; \
              tpc.php project.yml; \
              SO="${EXTENSION_NAME}.so"; \
              if [ ! -f "$SO" ]; then SO="build/${EXTENSION_NAME}.so"; fi; \
              test -f "$SO"; \
              if readelf -d "$SO" | grep -Fq 'libphpx.so'; then echo 'libphpx.so must not remain a runtime dependency' >&2; exit 1; fi; \
              export LD_LIBRARY_PATH="${PHPX_HOME}/lib:${LD_LIBRARY_PATH:-}"; \
              php -d "extension=/src/$SO" -r 'exit((extension_loaded(getenv("EXTENSION_NAME")) || extension_loaded("typephp_" . getenv("EXTENSION_NAME"))) ? 0 : 1);'; \
              php -d "extension=/src/$SO" vendor/bin/pest --ci --no-coverage; \
              mkdir -p /out; cp "$SO" /out/
          FROM scratch
          COPY --from=0 /out/ /
          EOF
          if [ "${TYPEPHP_LOCAL_FALLBACK:-false}" = true ]; then
            docker buildx build --builder default --file Dockerfile.native --build-context package=./package-context \
              --build-arg EXTENSION_NAME="$EXTENSION_NAME" --build-arg TYPEPHP_IMAGE="$TYPEPHP_IMAGE" --no-cache \
              --output type=local,dest=artifacts .
          else
            build_args=(
            docker buildx build
            --file Dockerfile.native
            --build-context package=./package-context
            --build-arg EXTENSION_NAME="$EXTENSION_NAME"
            --build-arg TYPEPHP_IMAGE="$TYPEPHP_IMAGE"
            --cache-from "type=gha,scope=$CACHE_SCOPE"
            --cache-to "type=gha,scope=$CACHE_SCOPE,mode=max"
            --output type=local,dest=artifacts
            .
            )
            if ! "${build_args[@]}"; then
              echo "Cached BuildKit path failed; retrying clean" >&2
              docker buildx build --file Dockerfile.native --build-context package=./package-context \
                --build-arg EXTENSION_NAME="$EXTENSION_NAME" --build-arg TYPEPHP_IMAGE="$TYPEPHP_IMAGE" --no-cache \
                --output type=local,dest=artifacts .
            fi
          fi
          test -f "artifacts/$EXTENSION_NAME.so"
          ARCHIVE="php_${EXTENSION_NAME}-${VERSION}_php8.5-x86_64-linux-glibc-nts.tgz"
          tar -czf "artifacts/$ARCHIVE" -C artifacts "$EXTENSION_NAME.so"
          tar -tzf "artifacts/$ARCHIVE" | grep -Fx "$EXTENSION_NAME.so"

      - name: Upload validated PIE asset
        env:
          GH_TOKEN: ${{github.token}}
          VERSION: ${{steps.version.outputs.version}}
        run: gh release upload "$VERSION" "artifacts/php_${EXTENSION_NAME}-${VERSION}_php8.5-x86_64-linux-glibc-nts.tgz" --repo "$GITHUB_REPOSITORY" --clobber
